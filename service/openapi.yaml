openapi: 3.0.3
info:
  title: URL Shortener
  version: 1.0.0
  description: Create short links, redirect, and read privacy-preserving click analytics.
servers:
  - url: http://localhost:5000
paths:
  /api/v1/links:
    post:
      summary: Create a short link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateLinkRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "413": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /api/v1/links/{code}:
    parameters:
      - $ref: "#/components/parameters/Code"
    get:
      summary: Get link metadata
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Link" }
        "404": { $ref: "#/components/responses/Error" }
    delete:
      summary: Delete a link and its analytics
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
  /api/v1/links/{code}/stats:
    parameters:
      - $ref: "#/components/parameters/Code"
    get:
      summary: Click analytics for a link
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkStats" }
        "404": { $ref: "#/components/responses/Error" }
  /{code}:
    parameters:
      - $ref: "#/components/parameters/Code"
    get:
      summary: Redirect to the destination URL and record a click
      responses:
        "302":
          description: Redirect
          headers:
            Location: { schema: { type: string } }
        "404": { $ref: "#/components/responses/Error" }
  /healthz:
    get:
      summary: Liveness probe
      responses:
        "200": { description: OK }
components:
  parameters:
    Code:
      name: code
      in: path
      required: true
      schema: { type: string, pattern: "^[A-Za-z0-9_-]{3,32}$" }
  schemas:
    CreateLinkRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2048, description: "http(s) URL with a host" }
        alias: { type: string, pattern: "^[A-Za-z0-9_-]{3,32}$" }
    Link:
      type: object
      properties:
        code: { type: string }
        shortUrl: { type: string }
        url: { type: string }
        createdAt: { type: string, format: date-time }
    LinkStats:
      type: object
      properties:
        code: { type: string }
        url: { type: string }
        createdAt: { type: string, format: date-time }
        totalClicks: { type: integer }
        lastClickedAt: { type: string, format: date-time, nullable: true }
        clicksByDay:
          type: object
          additionalProperties: { type: integer }
        topReferrers:
          type: array
          items:
            type: object
            properties:
              referrer: { type: string }
              clicks: { type: integer }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: array, items: { type: object } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
